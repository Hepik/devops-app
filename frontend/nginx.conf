server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker Compose only: "backend" resolves via Docker's embedded DNS
    # (127.0.0.11). In ECS this location is never actually reached — the
    # ALB routes /api/* straight to the backend Target Group before the
    # request ever gets to this container — but nginx still validates
    # every proxy_pass upstream AT STARTUP by default, and crashes if it
    # can't resolve one. Using a variable forces nginx to resolve at
    # REQUEST time instead, so a missing "backend" host no longer crashes
    # the whole container on boot.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:5000;

    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
